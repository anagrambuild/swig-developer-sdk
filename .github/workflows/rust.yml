name: Rust

on:
  push:
    branches: [main]
    paths: ['rust/**', 'LICENSE.txt', '.github/workflows/rust.yml', '.github/scripts/rust-release/**']
  pull_request:
    paths: ['rust/**', 'LICENSE.txt', '.github/workflows/rust.yml', '.github/scripts/rust-release/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s ../.github/scripts/rust-release
      - uses: dtolnay/rust-toolchain@1.87.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --workspace
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo package --locked -p swig-developer-sdk

  publish:
    needs: rust
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: publish-rust
      cancel-in-progress: false
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check published version
        id: release
        run: python3 ../.github/scripts/rust-release/release_plan.py
      - uses: dtolnay/rust-toolchain@1.87.0
        if: steps.release.outputs.publish == 'true'
      - name: Authenticate to crates.io
        if: steps.release.outputs.publish == 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish crate
        if: steps.release.outputs.publish == 'true'
        run: cargo publish --locked -p swig-developer-sdk
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: Create GitHub release
        if: steps.release.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: rust-v${{ steps.release.outputs.version }}
        run: |
          if git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            if [[ "$(git rev-parse "${RELEASE_TAG}^{commit}")" != "${GITHUB_SHA}" ]]; then
              echo "Release tag already points to a different commit" >&2
              exit 1
            fi
          else
            git tag "${RELEASE_TAG}" "${GITHUB_SHA}"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi
          if ! gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
              --verify-tag --title "${RELEASE_TAG}" --generate-notes
          fi
