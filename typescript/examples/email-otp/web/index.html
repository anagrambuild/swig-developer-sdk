<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  />
  <title>Swig email wallet</title>
  <style>
    body {
      font: 17px/1.5 system-ui;
      color: #183332;
      background: #f5f6f2;
      margin: 0;
    }
    main {
      max-width: 32rem;
      margin: 10vh auto;
      padding: 2rem;
    }
    h1 {
      font-size: 2.35rem;
      letter-spacing: -0.04em;
    }
    form {
      display: grid;
      gap: 0.6rem;
      margin: 1rem 0;
    }
    input,
    button {
      font: inherit;
      padding: 0.7rem;
      border: 1px solid #849b93;
      border-radius: 0.4rem;
    }
    button {
      background: #164941;
      color: white;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.55;
    }
    p {
      overflow-wrap: anywhere;
    }
    button:focus-visible,
    input:focus-visible {
      outline: 3px solid #db9c41;
    }
    [hidden] {
      display: none;
    }
  </style>
  <main>
    <h1>Swig email wallet</h1>
    <form id="start">
      <label for="email">Email address</label
      ><input id="email" autocomplete="email" type="email" required /><button>
        Send code
      </button>
    </form>
    <form id="verify" hidden>
      <label for="code">Verification code</label
      ><input
        id="code"
        inputmode="numeric"
        autocomplete="one-time-code"
        pattern="[0-9]{6}"
        required
      /><button>Verify email</button>
    </form>
    <p id="preview" style="white-space: pre-line"></p>
    <button id="approve" hidden>Review wallet and approve</button>
    <p id="status" role="status" aria-live="polite"></p>
    <button id="logout" hidden>Sign out</button>
    <button id="restart" hidden>Start again</button>
  </main>
  <script type="module" src="/main.js"></script>
</html>
