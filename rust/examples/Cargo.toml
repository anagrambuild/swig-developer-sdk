[package]
name = "swig-developer-sdk-examples"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
dotenvy = "0.15"
hex = "0.4"
k256 = { version = "0.13", features = ["ecdsa"] }
p256 = { version = "0.13", features = ["ecdsa"] }
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-keypair = "3.1"
solana-commitment-config = "3.1"
solana-message = "3.1"
solana-pubkey = "=4.1.0"
solana-rpc-client = { version = "=3.1.14", default-features = false }
solana-signature = "3.1"
solana-signer = "3.0"
solana-system-interface = { version = "2", features = ["bincode"] }
solana-transaction = { version = "3.1", features = ["bincode", "verify"] }
swig-developer-sdk = { path = "../sdk" }
tokio = { version = "1", features = ["macros", "rt"] }
url = "2.5"

[[bin]]
name = "keygen"
path = "src/bin/keygen.rs"

[lints.rust]
unsafe_code = "forbid"
