[package]
name = "swig-developer-sdk"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
description = "Swig Developer SDK for hosted clients and native transaction signing"
readme = "README.md"

[dependencies]
base64 = "0.22"
bincode = "1.3"
bs58 = "0.5"
hex = "0.4"
k256 = { version = "0.13", default-features = false, features = ["arithmetic"] }
p256 = { version = "0.13", default-features = false, features = ["arithmetic"] }
percent-encoding = "2"
solana-pubkey = "4.1"
solana-hash = "3.1"
solana-transaction = { version = "3.1", features = ["serde", "bincode"] }
solana-signature = "3.1"
thiserror = "2"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = { version = "=3.17.0", default-features = false, features = ["std", "macros"] }
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
solana-message = { version = "3.1", features = ["serde"] }
http = "1"
reqwest = { version = "0.12.28", default-features = false, features = ["stream"] }
tokio = { version = "1", features = ["macros", "rt"] }

[lints.rust]
unsafe_code = "forbid"
